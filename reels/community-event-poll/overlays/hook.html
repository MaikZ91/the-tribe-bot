<link rel="stylesheet" href="base.css">
<style>
  .scrim-top { height: 1020px; }
  .top { position: absolute; top: 190px; left: 72px; right: 72px; text-align: center; }
  .top .tag { margin-bottom: 40px; }
  .headline { font-size: 84px; color: var(--cream); }
  .headline .accent { color: var(--amber); }
  .vote { font-size: 104px; display: block; margin-bottom: 22px; }

  .divider {
    position: absolute; top: 0; bottom: 0; left: 538px; width: 4px;
    background: linear-gradient(180deg, rgba(247,242,234,0) 0%, rgba(247,242,234,0.85) 22%, rgba(247,242,234,0.85) 78%, rgba(247,242,234,0) 100%);
  }
  .side {
    position: absolute; bottom: 300px; width: 470px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .side.l { left: 56px; align-items: flex-start; text-align: left; }
  .side.r { right: 56px; align-items: flex-end; text-align: right; }
  .badge {
    font-family: 'Anton', sans-serif; font-size: 40px; line-height: 1;
    color: var(--ink); padding: 12px 22px 9px; border-radius: 14px;
  }
  .side.l .badge { background: var(--amber); }
  .side.r .badge { background: var(--violet); color: var(--cream); }
  .name { font-family: 'Anton', sans-serif; font-size: 60px; line-height: 0.98; text-transform: uppercase;
          text-shadow: 0 6px 30px rgba(0,0,0,0.85); }
  .emoji { font-size: 56px; display: block; margin-bottom: 6px; }
</style>

<div class="stage">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>
  <div class="divider"></div>

  <div class="top">
    <span class="tag">The Tribe · Community Vote</span>
    <div class="headline">
      <span class="vote">🗳️</span>
      Welches Event sollen&nbsp;wir<br>als <span class="accent">Nächstes</span> veranstalten?
    </div>
  </div>

  <div class="side l">
    <span class="emoji">🎧</span>
    <span class="badge">A</span>
    <span class="name">Silent<br>Disco</span>
  </div>

  <div class="side r">
    <span class="emoji">🎨🎶</span>
    <span class="badge">B</span>
    <span class="name">Techno<br>× Paint</span>
  </div>
</div>
