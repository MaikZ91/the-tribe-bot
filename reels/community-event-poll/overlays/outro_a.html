<link rel="stylesheet" href="base.css">
<style>
  .veil { position: absolute; inset: 0; background: rgba(10,8,7,0.62); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 44px; padding: 0 70px; }
  .fire { font-family: 'Anton', sans-serif; font-size: 118px; line-height: 0.94; text-transform: uppercase;
          color: var(--cream); text-align: center; text-shadow: 0 10px 50px rgba(0,0,0,0.9); }
  .fire .em { font-size: 104px; }
  .cards { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 100%; }
  .card {
    width: 100%; display: flex; align-items: center; gap: 26px;
    padding: 30px 34px; border-radius: 26px;
    background: rgba(247,242,234,0.07);
    border: 3px solid rgba(247,242,234,0.22);
  }
  .card .badge {
    font-family: 'Anton', sans-serif; font-size: 46px; line-height: 1;
    padding: 14px 24px 10px; border-radius: 14px; color: var(--ink);
  }
  .card.a { border-color: var(--amber); }
  .card.a .badge { background: var(--amber); }
  .card.b { border-color: var(--violet); }
  .card.b .badge { background: var(--violet); color: var(--cream); }
  .card .em { font-size: 58px; }
  .card .txt { font-family: 'Anton', sans-serif; font-size: 62px; line-height: 1; text-transform: uppercase;
               color: var(--cream); }
  .oder { font-size: 34px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(247,242,234,0.75); }
</style>

<div class="stage">
  <div class="veil"></div>
  <div class="wrap">
    <div class="fire"><span class="em">🔥</span><br>Du entscheidest!</div>
    <div class="cards">
      <div class="card a">
        <span class="badge">A</span><span class="em">🎧</span><span class="txt">Silent Disco</span>
      </div>
      <div class="oder">oder</div>
      <div class="card b">
        <span class="badge">B</span><span class="em">🎨🎶</span><span class="txt">Techno × Paint</span>
      </div>
    </div>
  </div>
</div>
