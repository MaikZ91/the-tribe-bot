.btn-book{background:transparent;color:var(--bg);border:2px solid #F6F0E6;font-size:15px;min-height:44px;padding:8px 12px;white-space:nowrap}

.legal{flex:0 0 auto;text-align:center;font-size:11px;color:var(--mute)}

/* Animation: Fotos blenden ein, zoomen langsam; Vorher bleibt blass, Nachher leuchtet auf */
.ph img{opacity:0;transform:scale(1.12)}
.in .ph img{animation:enter 1s cubic-bezier(.2,.7,.2,1) forwards, drift 9s ease-in-out 1s infinite alternate}
.in .before img{filter:saturate(.75) brightness(.97)}
.in .after img{animation-delay:.35s,1.35s}
.in .after .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1.4s ease 1.4s 1 forwards, shine 1.4s ease 6s infinite}
.in .after .ph{animation:pop .6s ease 1.2s 1}
@keyframes enter{to{opacity:1;transform:scale(1.04)}}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes pop{50%{box-shadow:0 0 0 4px rgba(200,35,44,.55)}}
@media (prefers-reduced-motion:reduce){.ph img{opacity:1;transform:none;animation:none!important}.in .after .ph::after{display:none}}

<script>
(function(){
  var WA='https://wa.me/4917645961547?text=';
  var FREE=WA+encodeURIComponent('Hi Maik! Ich hätte gern den kostenlosen Profil-Check für mein Dating-Profil. Ich schick dir gleich 2–3 Screenshots.');
  var BOOK=WA+encodeURIComponent('Hi Maik! Ich möchte einen Launch-Platz für das Dating-Shooting für 99 €. Wann hast du noch einen Termin frei?');
  document.querySelectorAll('[data-free]').forEach(function(a){ a.href=FREE; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-book]').forEach(function(a){ a.href=BOOK; a.target='_blank'; a.rel='noopener'; });

  function cap(ev,props,instant){ try{ window.posthog && posthog.capture(ev,Object.assign({landing_variant:'datingpics-story'},props||{}),instant?{send_instantly:true}:undefined); }catch(e){} }

  // CTA-Tracking (gleiches Event wie bisher → Versionen bleiben vergleichbar)
  document.addEventListener('click',function(ev){
    var a=ev.target.closest&&ev.target.closest('a[href*="wa.me"]'); if(!a) return;
    var kind=a.getAttribute('data-cta')||'book';
    try{ window.fbq && fbq('track',kind==='free'?'Lead':'Contact',{content_name:kind==='free'?'profil-check':'shooting-99'}); }catch(e){}
    cap('whatsapp_cta_click',{cta_kind:kind,cta_location:a.getAttribute('data-cta-location')||'unknown'},true);
  },true);

  // Fotos animieren, sobald die Bilder geladen sind
  var w=document.getElementById('wrap'), imgs=w.querySelectorAll('.ph img'), left=imgs.length;
  function go(){ requestAnimationFrame(function(){ w.classList.add('in'); }); }
  imgs.forEach(function(i){ if(i.complete) { if(--left===0) go(); } else { i.addEventListener('load',function(){ if(--left===0) go(); }); i.addEventListener('error',function(){ if(--left===0) go(); }); } });
  setTimeout(go,1500);

  // Verweildauer (IG-In-App-Browser verliert pageleave)
  var vis=document.visibilityState==='visible'?Date.now():0, total=0, tk=0;
  function flush(){ if(vis){ total+=Date.now()-vis; vis=Date.now(); } }
  function send(reason){ flush(); cap('dating_dwell',{reason:reason,ticks:tk,dwell_ms:total},true); }
  setInterval(function(){ if(document.visibilityState==='visible'){ tk++; send('heartbeat'); } },5000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'){ send('hidden'); vis=0; } else { vis=Date.now(); } });
  addEventListener('pagehide',function(){ send('pagehide'); });
})();
</script>
