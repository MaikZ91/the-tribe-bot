<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Antwort-Baukasten für Kundenanfragen — kostenlos</title>
<meta name="description" content="Nie wieder überlegen, was du auf eine Anfrage schreibst: Situation wählen, fertige Antwort für WhatsApp oder Mail kopieren. Kostenlos.">
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
<header class="hero"><div class="in">
  <div class="brand"><i></i><a href="../">ai.made.in.bielefeld · Kostenlose Tools</a></div>
  <span class="tag">Antwort-Baukasten</span>
  <h1>Die perfekte Antwort auf jede Anfrage – <em>in 10 Sekunden.</em></h1>
  <p>Situation antippen, Namen eintragen, kopieren. Fertig für WhatsApp oder Mail.</p>
</div></header>
<main class="wrap">
  <div class="card">
    <h2><span class="step">1</span> Was ist passiert?</h2>
    <div class="chips" id="sit"></div>
    <label>Anrede</label><div class="chips" id="ton"></div>
  </div>
  <div class="card">
    <h2><span class="step">2</span> Details</h2>
    <div class="row2"><div><label for="kunde">Name des Kunden</label><input id="kunde" placeholder="Frau Schmidt"></div><div><label for="firma">Dein Name / Betrieb</label><input id="firma" placeholder="Maik, Malerbetrieb Muster"></div></div>
    <div class="row2"><div><label for="t1">Terminvorschlag 1</label><input id="t1" placeholder="Di, 14 Uhr"></div><div><label for="t2">Terminvorschlag 2</label><input id="t2" placeholder="Do, 9 Uhr"></div></div>
  </div>
  <div class="card">
    <h2><span class="step">3</span> Deine Antwort</h2>
    <div class="out" id="out"></div>
    <div class="row2"><button class="btn" id="copy">Kopieren</button><a class="btn dark" id="wa" target="_blank" rel="noopener">In WhatsApp öffnen</a></div>
  </div>
  <div id="kit-footer"></div>
</main>
<script src="../kit/kit.js"></script>
<script>
(function(){
var S={
 neu:['Neue Anfrage – Termin vorschlagen',function(a){return a.hallo+'\n\nvielen Dank für '+a.ihre+' Anfrage! Damit ich '+a.ihnen+' ein genaues Angebot machen kann, schaue ich mir das gern kurz vor Ort an. Passt '+a.dir+' '+a.t1+' oder '+a.t2+'?\n\nViele Grüße\n'+a.firma;}],
 preis:['Fragt nach dem Preis',function(a){return a.hallo+'\n\ndanke für '+a.ihre+' Nachricht! Der Preis hängt stark davon ab, was genau gemacht werden soll. Damit ich keine Hausnummer nenne: '+(a.du?'Kannst du':'Können Sie')+' mir 2–3 Fotos und die ungefähre Größe schicken? Dann '+(a.du?'bekommst du':'bekommen Sie')+' innerhalb von 24 Stunden ein Festpreis-Angebot.\n\nViele Grüße\n'+a.firma;}],
 voll:['Gerade ausgebucht',function(a){return a.hallo+'\n\nvielen Dank für '+a.ihre+' Anfrage – das freut mich sehr! Aktuell bin ich leider bis in drei Wochen ausgebucht. Soll ich '+a.sie+' auf die Liste setzen und melden, sobald ein früherer Termin frei wird?\n\nViele Grüße\n'+a.firma;}],
 nachfassen:['Angebot nachfassen',function(a){return a.hallo+'\n\nich wollte kurz nachfragen, ob mein Angebot gut angekommen ist und ob noch Fragen offen sind. Wenn es passt, kann ich '+a.t1+' starten.\n\nViele Grüße\n'+a.firma;}],
 danke:['Nach dem Auftrag – Danke + Bewertung',function(a){return a.hallo+'\n\nvielen Dank für '+a.ihr+' Vertrauen! Ich hoffe, '+a.du2+' mit dem Ergebnis zufrieden. Wenn ja, würde mir eine kurze Google-Bewertung sehr helfen – das dauert nur eine Minute.\n\nViele Grüße\n'+a.firma;}],
 absage:['Passt nicht – freundlich absagen',function(a){return a.hallo+'\n\nvielen Dank für '+a.ihre+' Anfrage! Leider passt der Auftrag nicht in mein Leistungsspektrum, deshalb möchte ich '+a.ihnen+' ehrlich absagen, statt '+a.sie+' warten zu lassen. Ich wünsche '+a.ihnen+' viel Erfolg bei der Suche!\n\nViele Grüße\n'+a.firma;}]
};
var sit='neu', du=false;
Object.keys(S).forEach(function(k){ var b=document.createElement('button'); b.className='chip'; b.textContent=S[k][0]; b.onclick=function(){sit=k;render();}; b.dataset.k=k; K.$('sit').appendChild(b); });
[['Sie',false],['Du',true]].forEach(function(x){ var b=document.createElement('button'); b.className='chip'; b.textContent=x[0]; b.onclick=function(){du=x[1];render();}; b.dataset.du=x[1]; K.$('ton').appendChild(b); });
K.remember(['firma']);
function render(){
  document.querySelectorAll('#sit .chip').forEach(function(b){b.classList.toggle('on',b.dataset.k===sit);});
  document.querySelectorAll('#ton .chip').forEach(function(b){b.classList.toggle('on',String(du)===b.dataset.du);});
  var n=K.$('kunde').value.trim();
  var a={du:du,hallo:du?('Hallo '+(n||'')).trim()+',':(n?'Guten Tag '+n+',':'Guten Tag,'),ihre:du?'deine':'Ihre',ihr:du?'dein':'Ihr',ihnen:du?'dir':'Ihnen',sie:du?'dich':'Sie',dir:du?'dir':'Ihnen',du2:du?'du bist':'Sie sind',
    t1:K.$('t1').value.trim()||'Dienstag um 14 Uhr',t2:K.$('t2').value.trim()||'Donnerstag um 9 Uhr',firma:K.$('firma').value.trim()||'Dein Name'};
  var txt=S[sit][1](a);
  K.$('out').textContent=txt; K.$('wa').href=K.whatsapp(txt);
}
K.$('copy').onclick=function(){K.copy(K.$('out').textContent);};
document.addEventListener('input',render); render();
K.footer('antworten','Noch besser: Anfragen werden automatisch gelesen und direkt mit Terminvorschlägen beantwortet – auch abends und am Wochenende. Ob das bei dir passt, zeigt der KI-Check.');
})();
</script>
</body>
</html>
