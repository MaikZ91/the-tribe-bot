name: Mark Wednesday poll as done

# Einmal-Workflow: Die Mittwochs-Umfrage ist heute bereits in der Gruppe
# gelandet, der Lauf ist aber danach abgestuerzt — daher fehlt der Tagesmerker
# und der 20-Uhr-Lauf wuerde erneut posten. Setzt den Merker nach.
# Kein WhatsApp im Spiel: nur Cache lesen, JSON patchen, Cache schreiben.
# Nach dem Lauf wird diese Datei wieder entfernt.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-wednesday-poll.yml"

concurrency:
  group: whatsapp-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WhatsApp session and bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
            .daily-highlights-state.json
            .community-dashboard.json
            .pending-new-members.json
            .known-members.json
            images/daily-highlights
          key: whatsapp-bot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whatsapp-bot-

      - name: Mark wednesday-poll done for today
        run: |
          node -e '
            const fs = require("fs");
            const file = ".daily-highlights-state.json";
            const dateKey = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Europe/Berlin",
              year: "numeric", month: "2-digit", day: "2-digit"
            }).format(new Date());

            let state = {};
            try { state = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
            state.dueJobs = { ...(state.dueJobs || {}), "wednesday-poll": dateKey };
            fs.writeFileSync(file, JSON.stringify(state, null, 2));
            console.log("wednesday-poll als erledigt vermerkt fuer " + dateKey);
          '

      - name: Verify the session survived the round trip
        run: |
          # Der Cache-Save unten ueberschreibt den neuesten Stand — ohne
          # .wwebjs_auth waere die Session weg und eine neue Kopplung noetig.
          if [ ! -d .wwebjs_auth ]; then
            echo "::error::.wwebjs_auth fehlt — Abbruch, sonst geht die Session verloren."
            exit 1
          fi
          echo ".wwebjs_auth vorhanden: $(du -sh .wwebjs_auth | cut -f1)"
          cat .daily-highlights-state.json | head -20

      - name: Save WhatsApp session and bot state
        uses: actions/cache/save@v4
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
            .daily-highlights-state.json
            .community-dashboard.json
            .pending-new-members.json
            .known-members.json
            images/daily-highlights
          key: whatsapp-bot-${{ github.run_id }}-${{ github.run_attempt }}
