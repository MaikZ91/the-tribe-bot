name: WhatsApp Bot

on:
  push:
    branches:
      - main
    # Wegen dieses Pfadfilters löst ein leerer Commit KEINEN Lauf aus — um den
    # Bot ausserhalb des Zeitplans zu starten, muss eine der Dateien unten
    # tatsächlich verändert werden.
    paths:
      - ".github/workflows/whatsapp-bot.yml"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "render-highlights-video.js"
  workflow_dispatch:
    inputs:
      command:
        # Ab 03.08. gilt der Weekend Starter: friday-poll ist dann die
        # Zusage-Umfrage am Donnerstag, saturday-reminder der Reminder am
        # Freitag. Die Schluessel bleiben, damit gespeicherte Tagesmerker und
        # bestehende Aufrufe weiter passen.
        description: "Bot command (ab 03.08.: friday-poll = Do Zusage, saturday-reminder = Fr Reminder)"
        required: true
        default: "run-due"
        type: choice
        options:
          - run-due
          - daily-highlights
          - daily-highlights-video
          - wednesday-poll
          - friday-poll
          - saturday-reminder
          - weekly-calendar
          - tuesday-run
          - jam-session
          - thursday-football
          - ping-pong
          - check-new-members
          - germany-export
      force_fresh_auth:
        description: "WhatsApp-Session-Cache löschen (erzwingt neue Kopplung)"
        required: false
        default: false
        type: boolean
      pairing_number:
        description: "Telefonnummer international ohne + und Leerzeichen (z. B. 4915112345678). Gesetzt = Kopplung per 8-stelligem Code statt QR-Scan."
        required: false
        default: ""
        type: string
      friday_poll_venue_override:
        description: "Optional: Venue-Name für friday-poll erzwingen (z. B. 'Café Barcelona'). Leer lassen für normales Verhalten."
        required: false
        default: ""
        type: string
  schedule:
    # Vier Dauerläufe am Tag, je knapp sechs Stunden — zusammen decken sie den
    # Tag ab. Der Bot bleibt dabei verbunden, damit 'message' und 'group_join'
    # ankommen (Dashboard-Zahlen, Mitglieder-Begrüßung). Die Posts löst er
    # selbst aus, alle zehn Minuten über runDueJobs().
    #
    # Feste Post-Crons gibt es deshalb nicht mehr. Vier Läufe am Tag werden von
    # GitHub auch deutlich seltener übersprungen als der frühere Halbstunden-
    # takt: gemessen über 38,6 h liefen von 77 erwarteten */30-Läufen nur 30.
    - cron: "0 0,6,12,18 * * *"

concurrency:
  group: whatsapp-bot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Ein Actions-Job darf höchstens 6 Stunden laufen. Der Bot steigt im
    # Dauerlauf nach 5,75 h von selbst aus; dieses Limit ist nur das Netz
    # darunter. Öffentliche Repos zahlen keine Runner-Minuten.
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Restore WhatsApp session and bot state
        id: restore-bot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
            .daily-highlights-state.json
            .community-dashboard.json
            .pending-new-members.json
            .known-members.json
            images/daily-highlights
          key: whatsapp-bot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whatsapp-bot-

      - name: Force fresh WhatsApp auth (clear session cache)
        if: github.event_name == 'workflow_dispatch' && inputs.force_fresh_auth == true
        run: |
          echo "Lösche .wwebjs_auth und .wwebjs_cache, damit ein neuer QR-Code generiert wird."
          rm -rf .wwebjs_auth .wwebjs_cache

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bot command
        env:
          # Automatische Läufe (Zeitplan wie Push) halten die Verbindung offen,
          # damit 'message' und 'group_join' ankommen. Nur ein manuell
          # ausgelöster Lauf mit gewähltem Kommando bleibt ein Einmal-Lauf.
          BOT_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.command || '' }}
          BOT_RESIDENT: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          FRIDAY_POLL_VENUE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.friday_poll_venue_override || '' }}
          # Falls als Secret hinterlegt, koppeln sich auch geplante Läufe nach
          # einem Session-Verlust selbst per Code — sonst nur manuelle Läufe.
          WHATSAPP_PAIRING_NUMBER: ${{ (github.event_name == 'workflow_dispatch' && inputs.pairing_number) || secrets.WHATSAPP_PAIRING_NUMBER || '' }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          WHATSAPP_TUESDAY_RUN_CHAT_ID: ${{ secrets.WHATSAPP_TUESDAY_RUN_CHAT_ID }}
          WHATSAPP_JAM_SESSION_CHAT_ID: ${{ secrets.WHATSAPP_JAM_SESSION_CHAT_ID }}
          WHATSAPP_ANNOUNCEMENTS_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENTS_CHAT_ID }}
          WHATSAPP_AUSGEHEN_CHAT_ID: ${{ secrets.WHATSAPP_AUSGEHEN_CHAT_ID }}
          WHATSAPP_COMMUNITY_SOURCE_CHAT_IDS: ${{ secrets.WHATSAPP_COMMUNITY_SOURCE_CHAT_IDS }}
          TRIBE_TUESDAY_RUN_IMAGE_URL: ${{ secrets.TRIBE_TUESDAY_RUN_IMAGE_URL }}
          TRIBE_JAM_SESSION_IMAGE_URL: ${{ secrets.TRIBE_JAM_SESSION_IMAGE_URL }}
          TRIBE_THURSDAY_FOOTBALL_IMAGE_URL: ${{ secrets.TRIBE_THURSDAY_FOOTBALL_IMAGE_URL }}
          TRIBE_KENNENLERNABEND_IMAGE_URL: ${{ secrets.TRIBE_KENNENLERNABEND_IMAGE_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm start

      - name: Upload QR code artifact (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-qr-code
          path: qr-code.png
          if-no-files-found: ignore
          retention-days: 1

      # Der Bot schreibt .auth-ok, sobald er angemeldet war.
      - name: Did the session authenticate?
        id: authcheck
        if: always()
        run: |
          if [ -f .auth-ok ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Session war angemeldet — Cache wird gesichert."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keine Anmeldung in diesem Lauf — Cache bleibt unangetastet."
          fi

      # Auch bei Fehlschlag sichern, damit eine kurz zuvor erfolgreiche
      # Anmeldung nicht verloren geht — aber NUR dann. Ohne diese Bedingung
      # ueberschreibt ein Lauf ohne Anmeldung die funktionierende Session, und
      # jeder weitere Lauf stellt danach die kaputte wieder her.
      - name: Save WhatsApp session and bot state
        if: always() && steps.authcheck.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .wwebjs_auth
            .wwebjs_cache
            .daily-highlights-state.json
            .community-dashboard.json
            .pending-new-members.json
            .known-members.json
            images/daily-highlights
          key: whatsapp-bot-${{ github.run_id }}-${{ github.run_attempt }}